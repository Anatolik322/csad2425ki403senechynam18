name: build, deploy, test

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Завантаження коду
              uses: actions/checkout@v2

            - name: Налаштування Python
              uses: actions/setup-python@v2
              with:
                  python-version: "3.x"

            - name: Деплой бінарних файлів
              run: |
                  cp client/client.py deploy/
                  echo "Бінарні файли задеплоєні в папку deploy."

    test:
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Завантаження коду
              uses: actions/checkout@v2

            - name: Запуск тестів
              run: |
                  python client/client.py
